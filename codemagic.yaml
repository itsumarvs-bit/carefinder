workflows:
  carefinder-ios:
    name: CareFinder iOS Device Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      node: 22

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build Ionic application
        script: npx ionic build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Build unsigned iOS device app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R build/ios-device/Build/Products/Debug-iphoneos/App.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload CareFinder.ipa

    artifacts:
      - CareFinder.ipa
